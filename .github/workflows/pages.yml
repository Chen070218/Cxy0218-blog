name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: '1'
      NEXT_PUBLIC_BASE_PATH: '/${{ github.event.repository.name }}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: XHBlogs/package-lock.json
      # Static hosting has no server, so the /api routes cannot be exported; move them aside before the build
      - name: Move API routes aside (static export has no server)
        run: mv XHBlogs/app/api XHBlogs/app/_api_disabled
      - name: Install dependencies
        run: npm ci
        working-directory: XHBlogs
      - name: Build static site
        run: npx next build --webpack
        working-directory: XHBlogs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: XHBlogs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # Pages can sit in syncing_files; keep the first attempt bounded,
          # then retry once with a longer window.
          timeout: 600000
          error_count: 10
          reporting_interval: 10000

      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - id: retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 10
          reporting_interval: 10000

      - name: Fail if both Pages deployment attempts failed
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: exit 1